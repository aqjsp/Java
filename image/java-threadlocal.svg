<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="system-ui, -apple-system, sans-serif">
  <rect width="960" height="380" rx="12" fill="#fafafa"/>
  <text x="480" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">ThreadLocal：value 挂在每条 Thread 上，Entry 的 key 是弱引用</text>
  <rect x="30" y="52" width="250" height="150" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="155" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#1565c0">Thread（线程池里活很久）</text>
  <text x="155" y="104" text-anchor="middle" font-size="12" fill="#1565c0">threadLocals</text>
  <text x="155" y="126" text-anchor="middle" font-size="12" fill="#1565c0">→ ThreadLocalMap</text>
  <rect x="50" y="140" width="210" height="46" rx="6" fill="#bbdefb" stroke="#0d47a1"/>
  <text x="155" y="160" text-anchor="middle" font-size="11" fill="#0d47a1">Entry[]（开放寻址，线性探测）</text>
  <text x="155" y="178" text-anchor="middle" font-size="11" fill="#0d47a1">cap 16，2/3 扩容</text>

  <rect x="330" y="52" width="300" height="150" rx="8" fill="#fff3e0" stroke="#e65100"/>
  <text x="480" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">Entry extends WeakReference</text>
  <text x="480" y="106" text-anchor="middle" font-size="12" fill="#c62828">key：弱引用 → ThreadLocal 对象</text>
  <text x="480" y="130" text-anchor="middle" font-size="12" fill="#1b5e20">value：强引用 → 你存的对象</text>
  <text x="480" y="160" text-anchor="middle" font-size="11" fill="#546e7a">下标 threadLocalHashCode &amp; (len-1)</text>
  <text x="480" y="180" text-anchor="middle" font-size="11" fill="#546e7a">撞了 nextIndex 往后挪</text>

  <rect x="680" y="52" width="250" height="150" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="805" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">ThreadLocal 对象</text>
  <text x="805" y="104" text-anchor="middle" font-size="12" fill="#1b5e20">你的 static final 字段引用它</text>
  <text x="805" y="132" text-anchor="middle" font-size="11" fill="#37474f">字段没了 → 只剩弱引用</text>
  <text x="805" y="152" text-anchor="middle" font-size="11" fill="#37474f">→ GC 回收 key</text>
  <text x="805" y="176" text-anchor="middle" font-size="11" fill="#c62828">Entry.get()==null 变陈旧</text>

  <path d="M280 163 L330 120" stroke="#0d47a1" stroke-width="2"/>
  <path d="M630 100 L680 100" stroke="#c62828" stroke-width="2" stroke-dasharray="5 4"/>

  <rect x="30" y="220" width="900" height="140" rx="8" fill="#ffcdd2" stroke="#c62828"/>
  <text x="480" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#b71c1c">内存泄漏形状：key 被回收，value 仍被 Thread 强引用</text>
  <text x="480" y="278" text-anchor="middle" font-size="13" fill="#b71c1c">table → Entry → value（强）　只要线程活着，value 不回收</text>
  <text x="480" y="304" text-anchor="middle" font-size="12" fill="#37474f">get/set 撞到陈旧槽会顺手 expungeStaleEntry 清一格，但「碰上才清」，不保证清干净</text>
  <text x="480" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">正解：用完 remove()。线程池 finally 里 remove，否则复用线程串数据 + 泄漏</text>
</svg>
