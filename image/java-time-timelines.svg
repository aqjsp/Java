<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="system-ui, -apple-system, sans-serif">
  <rect width="960" height="380" rx="12" fill="#fafafa"/>
  <text x="480" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">三条时间线：Instant 是绝对时刻，LocalDateTime 没有时区</text>

  <rect x="30" y="56" width="900" height="88" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="60" y="84" font-size="14" font-weight="700" fill="#1b5e20">Instant</text>
  <text x="60" y="108" font-size="12" fill="#37474f">机器时间线上一个点 = UTC 纪元秒 + 纳秒。全球唯一，无时区。存时间戳、算“过了多久”。</text>
  <text x="60" y="130" font-size="12" fill="#546e7a">对应旧 Date。Duration.between(Instant, Instant) 求间隔。</text>

  <rect x="30" y="156" width="900" height="88" rx="8" fill="#fff3e0" stroke="#e65100"/>
  <text x="60" y="184" font-size="14" font-weight="700" fill="#e65100">LocalDateTime</text>
  <text x="60" y="208" font-size="12" fill="#37474f">墙上的 2024-03-10T02:30。没有时区 → 不对应任何一个绝对时刻。</text>
  <text x="60" y="230" font-size="12" fill="#c62828">当时间戳存 = 丢了“哪个时区”。→ Instant 必须先 atZone(ZoneId) 补时区。</text>

  <rect x="30" y="256" width="900" height="98" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="60" y="284" font-size="14" font-weight="700" fill="#1565c0">ZonedDateTime</text>
  <text x="60" y="308" font-size="12" fill="#37474f">LocalDateTime + ZoneId + 解析出的偏移。带完整时区规则（含夏令时）。</text>
  <text x="60" y="330" font-size="12" fill="#37474f">2024-03-10 02:30 在 America/New_York 不存在 → atZone 推到 03:30-04:00。</text>
  <text x="60" y="348" font-size="11" fill="#546e7a">存 Instant / UTC，展示才转 ZonedDateTime。ZoneId 用 IANA 名（Asia/Shanghai），别用 GMT+8。</text>
</svg>
