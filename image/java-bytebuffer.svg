<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" font-family="system-ui, -apple-system, sans-serif">
  <rect width="920" height="300" rx="12" fill="#fafafa"/>
  <text x="460" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">ByteBuffer：capacity 钉死，position / limit 在中间走</text>
  <text x="60" y="70" font-size="13" fill="#37474f">写完 4 字节之后（position=4, limit=capacity=8）</text>
  <rect x="60" y="86" width="800" height="44" rx="6" fill="#eceff1" stroke="#90a4ae"/>
  <rect x="60" y="86" width="400" height="44" fill="#bbdefb"/>
  <text x="160" y="114" font-size="13" fill="#0d47a1">已写 0..3</text>
  <text x="620" y="114" font-size="13" fill="#546e7a">还可写 4..7</text>
  <text x="60" y="150" font-size="11" fill="#1565c0">0</text>
  <text x="250" y="150" font-size="11" fill="#1565c0">position</text>
  <text x="840" y="150" font-size="11" fill="#37474f">limit = capacity</text>
  <text x="60" y="186" font-size="13" fill="#37474f">flip() 之后：limit←position，position←0，准备读刚才写进去的</text>
  <rect x="60" y="202" width="800" height="44" rx="6" fill="#eceff1" stroke="#90a4ae"/>
  <rect x="60" y="202" width="400" height="44" fill="#c8e6c9"/>
  <text x="160" y="230" font-size="13" fill="#1b5e20">可读 0..3</text>
  <text x="620" y="230" font-size="13" fill="#546e7a">4..7 在 limit 之外，读不到</text>
  <text x="60" y="278" font-size="11" fill="#2e7d32">0 = position</text>
  <text x="250" y="278" font-size="11" fill="#2e7d32">limit</text>
  <text x="840" y="278" font-size="11" fill="#37474f">capacity</text>
</svg>
