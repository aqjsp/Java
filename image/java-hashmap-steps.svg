<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="system-ui, -apple-system, sans-serif">
  <rect width="960" height="520" rx="12" fill="#fafafa"/>
  <text x="480" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">hashCode 恒为 1：第 1 / 第 9 / 第 11 次 put 的桶</text>
  <text x="480" y="48" text-anchor="middle" font-size="11" fill="#546e7a">hash = 1^(1&gt;&gt;&gt;16) = 1　下标 (n-1)&amp;1 = 1　lo/hi 位 1&amp;oldCap = 0，扩容不拆链</text>

  <rect x="16" y="62" width="300" height="430" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="166" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1565c0">put #1　table 从 null 起</text>
  <text x="166" y="108" text-anchor="middle" font-size="11" fill="#1565c0">resize → n=16 threshold=12</text>
  <rect x="36" y="122" width="40" height="22" rx="3" fill="#fff" stroke="#90a4ae"/><text x="56" y="138" text-anchor="middle" font-size="10" fill="#546e7a">0</text>
  <rect x="36" y="148" width="40" height="22" rx="3" fill="#bbdefb" stroke="#0d47a1"/><text x="56" y="164" text-anchor="middle" font-size="10" fill="#0d47a1">1</text>
  <rect x="88" y="148" width="200" height="22" rx="3" fill="#ffe0b2" stroke="#e65100"/><text x="188" y="164" text-anchor="middle" font-size="11" fill="#bf360c">k0</text>
  <rect x="36" y="174" width="40" height="22" rx="3" fill="#fff" stroke="#90a4ae"/><text x="56" y="190" text-anchor="middle" font-size="10" fill="#546e7a">2..15 空</text>
  <text x="166" y="230" text-anchor="middle" font-size="11" fill="#37474f">size=1　无树化</text>
  <text x="166" y="252" text-anchor="middle" font-size="11" fill="#37474f">桶 1：1 个节点</text>
  <text x="166" y="290" text-anchor="middle" font-size="11" fill="#546e7a">put #2–#8 只往桶 1 尾插</text>
  <text x="166" y="312" text-anchor="middle" font-size="11" fill="#546e7a">binCount 加第 8 个时是 6</text>
  <text x="166" y="334" text-anchor="middle" font-size="11" fill="#546e7a">6 ≥ 7？否。还不调 treeifyBin</text>

  <rect x="330" y="62" width="300" height="430" rx="8" fill="#fff3e0" stroke="#e65100"/>
  <text x="480" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">put #9　已有 8 个，再尾插</text>
  <text x="480" y="108" text-anchor="middle" font-size="11" fill="#e65100">binCount=7 ≥ 7 → treeifyBin</text>
  <text x="480" y="132" text-anchor="middle" font-size="11" fill="#bf360c">tab.length=16 &lt; 64 → 只 resize</text>
  <text x="480" y="156" text-anchor="middle" font-size="11" fill="#bf360c">16→32　1&amp;16=0 全留桶 1</text>
  <rect x="350" y="176" width="260" height="200" rx="6" fill="#fff" stroke="#e65100"/>
  <text x="480" y="200" text-anchor="middle" font-size="11" fill="#e65100">桶 1 仍是链表 9 个</text>
  <text x="480" y="224" text-anchor="middle" font-size="11" fill="#37474f">k0→k1→…→k8</text>
  <text x="480" y="248" text-anchor="middle" font-size="11" fill="#37474f">没有 TreeNode</text>
  <text x="480" y="280" text-anchor="middle" font-size="11" fill="#37474f">n=32 threshold=24</text>
  <text x="480" y="304" text-anchor="middle" font-size="11" fill="#37474f">size=9　9&gt;24？否</text>
  <text x="480" y="348" text-anchor="middle" font-size="12" fill="#c62828">「第 8 次就树化」是错的</text>
  <text x="480" y="372" text-anchor="middle" font-size="11" fill="#c62828">源码：已有 8 个再加第 9 个才调</text>
  <text x="480" y="396" text-anchor="middle" font-size="11" fill="#c62828">且表 &lt; 64 只扩容</text>

  <rect x="644" y="62" width="300" height="430" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="794" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">put #10 再 #11</text>
  <text x="794" y="110" text-anchor="middle" font-size="11" fill="#2e7d32">#10：32&lt;64 → resize 32→64</text>
  <text x="794" y="132" text-anchor="middle" font-size="11" fill="#2e7d32">1&amp;32=0 仍全在桶 1</text>
  <text x="794" y="156" text-anchor="middle" font-size="11" fill="#1b5e20">#11：n=64 ≥ 64 → 真 treeify</text>
  <rect x="664" y="176" width="260" height="200" rx="6" fill="#fff" stroke="#2e7d32"/>
  <text x="794" y="208" text-anchor="middle" font-size="12" fill="#1b5e20">桶 1 = TreeNode 红黑树</text>
  <text x="794" y="236" text-anchor="middle" font-size="11" fill="#37474f">仍保留 next，遍历可当链表</text>
  <text x="794" y="264" text-anchor="middle" font-size="11" fill="#37474f">size=11 threshold=48</text>
  <text x="794" y="300" text-anchor="middle" font-size="11" fill="#37474f">hash 均匀时 #9 扩容就把链拆开</text>
  <text x="794" y="324" text-anchor="middle" font-size="11" fill="#37474f">根本走不到这一格</text>
  <text x="794" y="400" text-anchor="middle" font-size="11" fill="#2e7d32">树化是防最坏哈希，不是默认路径</text>
</svg>
