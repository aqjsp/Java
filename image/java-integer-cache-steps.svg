<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="system-ui, -apple-system, sans-serif">
  <rect width="960" height="360" rx="12" fill="#fafafa"/>
  <text x="480" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">IntegerCache：valueOf(127) 同一份；valueOf(128) 两份；new 不进池</text>
  <rect x="20" y="48" width="920" height="70" rx="8" fill="#eceff1" stroke="#90a4ae"/>
  <text x="480" y="78" text-anchor="middle" font-size="13" fill="#37474f">cache[] 下标 0 对应 -128，下标 255 对应 127。valueOf(i) 返回 cache[i+128]（low=-128）</text>
  <text x="480" y="100" text-anchor="middle" font-size="12" fill="#546e7a">JLS 5.1.7 保证这段身份；high 默认 127，assert high≥127</text>

  <rect x="20" y="136" width="300" height="196" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="170" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">a=127; b=127</text>
  <text x="170" y="192" text-anchor="middle" font-size="12" fill="#1b5e20">两次 valueOf(127)</text>
  <text x="170" y="216" text-anchor="middle" font-size="12" fill="#1b5e20">都返回 cache[255]</text>
  <text x="170" y="248" text-anchor="middle" font-size="12" fill="#1b5e20">a == b　true（规范）</text>
  <text x="170" y="280" text-anchor="middle" font-size="11" fill="#37474f">字节码：bipush 127</text>
  <text x="170" y="300" text-anchor="middle" font-size="11" fill="#37474f">invokestatic valueOf</text>

  <rect x="330" y="136" width="300" height="196" rx="8" fill="#fff3e0" stroke="#e65100"/>
  <text x="480" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">c=128; d=128</text>
  <text x="480" y="192" text-anchor="middle" font-size="12" fill="#e65100">128 &gt; high(默认)</text>
  <text x="480" y="216" text-anchor="middle" font-size="12" fill="#e65100">两次 new Integer(128)</text>
  <text x="480" y="248" text-anchor="middle" font-size="12" fill="#e65100">c == d　未规定 / 默认 false</text>
  <text x="480" y="280" text-anchor="middle" font-size="11" fill="#37474f">sipush 128</text>
  <text x="480" y="300" text-anchor="middle" font-size="11" fill="#37474f">invokestatic valueOf</text>

  <rect x="640" y="136" width="300" height="196" rx="8" fill="#ffcdd2" stroke="#c62828"/>
  <text x="790" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#b71c1c">e=new Integer(127)</text>
  <text x="790" y="192" text-anchor="middle" font-size="12" fill="#b71c1c">不走 valueOf</text>
  <text x="790" y="216" text-anchor="middle" font-size="12" fill="#b71c1c">堆上另造，不进 cache</text>
  <text x="790" y="248" text-anchor="middle" font-size="12" fill="#b71c1c">e == valueOf(127)　false</text>
  <text x="790" y="280" text-anchor="middle" font-size="11" fill="#37474f">new + dup + bipush 127</text>
  <text x="790" y="300" text-anchor="middle" font-size="11" fill="#37474f">invokespecial &lt;init&gt;:(I)V</text>
</svg>
